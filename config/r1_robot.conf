# ---------------------------------------------------------------------------
# r1_robot configuration (phase 1)
#
# Format: "key = value", '#' starts a comment.  Every key has a safe default,
# so an empty file is a valid (and safe) configuration.
#
# SAFETY: nothing in this file can enable real hardware on its own.  Real
# motion still requires a compile-time backend + safety.allow_real_hardware
# + an explicit human-confirmed call to R1Arm::enableMotion().
# ---------------------------------------------------------------------------

# ----- backend selection ---------------------------------------------------
# mock    : offline simulation (default, always safe)
# unitree : real R1-7A over the official SDK serial bus
backend = mock

# ----- safety limits (URDF frame, SI units) --------------------------------
# Master switch.  While false, R1Arm refuses to connect to any backend that
# reports isRealHardware() == true.  Keep false unless you are running the
# documented bring-up procedure in HARDWARE_BRINGUP.md.
safety.allow_real_hardware = false

# Max age of a feedback frame before it is considered stale [s].
# TODO(bringup): verify a realistic value for the real 6 Mbaud bus.
safety.max_feedback_age_s = 0.05

# Soft limit margin kept away from the URDF joint limits [rad].
safety.soft_limit_margin = 0.05

# Max allowed |q_cmd - q_meas| per control cycle [rad] (anti-step check).
# TODO(bringup): tune against the real creep behaviour of the arm.
safety.max_joint_step_rad = 0.05

# Command envelope.
safety.max_kp = 100.0
safety.max_kd = 5.0
safety.max_tau = 30.0
safety.max_abs_velocity = 1.0

# Supply voltage floor [V].  TODO(bringup): verify real bus voltage; the SDK
# reports error bit 0x8 (transient undervoltage) when the supply sags.
safety.min_supply_voltage = 40.0

# ----- hardware (only used when backend = unitree) -------------------------
hardware.port = /dev/ttyUSB3
hardware.baudrate = 6000000
# Calibration is REQUIRED and must be produced/verified by calibrate_joints.
# Relative paths are resolved against the process working directory.
hardware.calib_path = config/joint_calib.txt
