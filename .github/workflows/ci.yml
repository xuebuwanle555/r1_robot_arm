name: CI

# Offline, hardware-free validation.  Nothing here ever connects to an arm: the
# unitree backend is *compiled* (to catch type/signature regressions) but never
# run against a port, and every test drives the MockArm / MockJointBus.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # -- C++ : the full safety stack, no SDK required -------------------------
  # Proves the offline core (types, limits, safety, R1Arm, ControlService, the
  # motion-gate permission boundary, the atomic feedback snapshot, MockJointBus)
  # builds and passes WITHOUT the third-party SDK checked out at all.
  cpp-mock-only:
    name: C++ (mock only, no SDK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y cmake g++ ninja-build
      - name: Configure (unitree backend OFF)
        run: >
          cmake -S . -B build-mock -G Ninja
          -DR1_ROBOT_WITH_UNITREE_BACKEND=OFF
          -DR1_ROBOT_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build build-mock
      - name: Test (ctest)
        run: ctest --test-dir build-mock --output-on-failure

  # -- C++ : with the pinned official SDK submodule -------------------------
  # Compiles the real-hardware backend + the patched SDK copy, and the build
  # itself enforces that the submodule checkout stays byte-clean.
  cpp-with-sdk:
    name: C++ (with pinned SDK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y cmake g++ ninja-build patch git
      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DR1_ROBOT_WITH_UNITREE_BACKEND=ON
          -DR1_ROBOT_WARNINGS_AS_ERRORS=ON
      - name: Build (also runs the SDK cleanliness check target)
        run: cmake --build build
      - name: Test (ctest)
        run: ctest --test-dir build --output-on-failure
      - name: Negative test - a stray file in the SDK fails the build
        run: |
          touch third_party/r1-7a_sdk/STRAY_TMP_FILE
          if cmake --build build --target r1_sdk_cleanliness_check 2>/dev/null; then
            echo "ERROR: cleanliness check passed despite a stray SDK file"; exit 1
          else
            echo "OK: cleanliness check rejected the modified checkout"
          fi
          rm -f third_party/r1-7a_sdk/STRAY_TMP_FILE

  # -- Python : offline core logic ------------------------------------------
  cpp-python:
    name: Python (offline tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install test deps
        # Pinocchio / MuJoCo are optional; those suites skip automatically when
        # they are absent, so the offline core is validated here without them.
        run: python -m pip install --upgrade pip && pip install numpy pytest
      - name: Run pytest
        working-directory: python
        run: python -m pytest -q -p no:cacheprovider

  # -- Simulation + the optional C++<->sim bridge ---------------------------
  # The offline job above lets the MuJoCo/Pinocchio suites skip, which means the
  # collision scenarios and the pybind11 bridge never get CI coverage.  This job
  # installs the `[sim]` extras and builds the opt-in binding so both actually
  # execute.  It is separate on purpose: Mock-only builds must never need
  # Python, pybind11, MuJoCo or Pinocchio.
  sim-and-bridge:
    name: MuJoCo sim + C++/sim bridge
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install simulation extras
        run: |
          python -m pip install --upgrade pip
          pip install -e "python[sim,dev]"
          pip install pybind11
      - name: Configure with the bridge enabled
        run: >
          cmake -S . -B build-bridge
          -DR1_ROBOT_BUILD_PYTHON_BINDING=ON
          -DR1_ROBOT_WITH_UNITREE_BACKEND=OFF
          -DR1_ROBOT_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build build-bridge -j"$(nproc)"
      - name: C++ suites (bridge build config)
        run: ctest --test-dir build-bridge --output-on-failure
      - name: The bridge stays opt-in
        # A default configure must not even know the target exists: Mock-only
        # builds may never require Python, pybind11, MuJoCo or Pinocchio.
        run: |
          cmake -S . -B build-plain -DR1_ROBOT_WITH_UNITREE_BACKEND=OFF
          cmake --build build-plain -j"$(nproc)"
          if cmake --build build-plain --target _control_binding 2>/dev/null; then
            echo "ERROR: the default build could build the python binding"
            exit 1
          fi
          echo "OK: default build has no binding target"
      - name: Run pytest including sim and bridge suites
        working-directory: python
        run: |
          python -m pytest -q -p no:cacheprovider
          python -m pytest -q -p no:cacheprovider tests/test_control_binding.py
          python -m pytest -q -p no:cacheprovider tests/test_dynamics.py -k collision

